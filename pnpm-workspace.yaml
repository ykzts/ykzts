packages:
  - apps/*
  - packages/*
  - profile
  - renovate-config

catalog:
  '@next/mdx': 16.3.0-preview.5
  '@portabletext/react': 6.2.0
  '@portabletext/types': 4.0.2
  '@supabase/ssr': 0.12.0
  '@supabase/supabase-js': 2.110.2
  '@tailwindcss/postcss': 4.3.2
  '@tailwindcss/typography': 0.5.20
  '@testing-library/jest-dom': 6.9.1
  '@testing-library/react': 16.3.2
  '@testing-library/user-event': 14.6.1
  '@types/node': 24.13.3
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  # TypeScript 7 (native) CLI as tsc; installed as @typescript/native to avoid
  # conflicting with the TypeScript 6 API package below.
  # See https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
  '@typescript/native': npm:typescript@7.0.2
  '@vercel/analytics': 2.0.1
  '@vercel/config': 0.5.5
  '@vercel/microfrontends': 2.4.0
  '@vitejs/plugin-react': 6.0.3
  ai: 7.0.22
  jsdom: 29.1.1
  lucide-react: 1.24.0
  next: 16.3.0-preview.5
  next-themes: 0.4.6
  postcss: 8.5.16
  react: 19.2.7
  react-dom: 19.2.7
  server-only: 0.0.1
  shadcn: 4.13.0
  shiki: 4.3.1
  sonner: 2.0.7
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.2
  tw-animate-css: 1.4.0
  # TypeScript 6 API + tsc6 binary (for tools that still need the classic API,
  # e.g. typescript-eslint). Alias keeps the import name `typescript`.
  typescript: npm:@typescript/typescript6@6.0.2
  vitest: 4.1.10
  zod: 4.4.3

allowBuilds:
  '@tailwindcss/oxide': true
  better-sqlite3: false
  core-js-pure: false
  dtrace-provider: false
  esbuild: true
  lefthook: true
  msw: false
  protobufjs: false
  re2: false
  sharp: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@next/*'
  - eslint-config-next
  - next
  - renovate
savePrefix: ''
