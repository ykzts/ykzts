# GitHub Copilot Coding Agent Setup Workflow
# This workflow sets up the development environment for GitHub Copilot Coding Agent
# in an ephemeral development environment.
#
# For more information, see:
# https://docs.github.com/ja/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment

name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js, and install dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          # renovate: datasource=github-releases depName=supabase/cli
          version: 3.4.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Setup environment
        run: ./scripts/setup-env.sh
