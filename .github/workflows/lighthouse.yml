# Lighthouse CI workflow for Portfolio app
name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'apps/portfolio/**'
      - '.github/workflows/lighthouse.yml'
    types: [opened, synchronize]
  push:
    branches: [main]
    paths:
      - 'apps/portfolio/**'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read

env:
  # renovate: datasource=node-version depName=node
  NODE_VERSION: 24.18.0
  # renovate: datasource=github-releases depName=supabase/cli
  SUPABASE_VERSION: 2.110.0

jobs:
  lighthouse:
    runs-on: ubicloud-standard-2
    timeout-minutes: 25
    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ env.SUPABASE_VERSION }}
      - name: Start Supabase local server
        run: supabase start
      - name: Get Supabase local connection details
        id: supabase
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_OUTPUT
          ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_OUTPUT
      - name: Run Lighthouse CI
        run: pnpm lighthouse --filter @ykzts/portfolio
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.SUPABASE_ANON_KEY }}
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: apps/portfolio/.lighthouseci/
          retention-days: 30
