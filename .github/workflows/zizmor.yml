# GitHub Actions security static analysis with zizmor
# https://docs.zizmor.sh/
#
# Scans workflows for issues such as:
# - artipacked (persist-credentials not set on checkout)
# - excessive-permissions
# - template-injection
# - etc.
name: zizmor

on:
  pull_request:
    paths:
      - ".github/workflows/**"
    types: [ opened, synchronize ]
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/**"

permissions: {}

env:
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.33.1

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          annotations: true
          version: ${{ env.ZIZMOR_VERSION }}
