# GitHub Actions security static analysis with zizmor
# https://docs.zizmor.sh/
#
# Scans workflows for issues such as:
# - artipacked (persist-credentials not set on checkout)
# - excessive-permissions
# - template-injection
# - etc.
name: zizmor

on:
  pull_request:
    paths:
      - '.github/workflows/**'
    types: [opened, synchronize]
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
          version: 1.27.0
